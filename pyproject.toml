[project]
name = "asteca"
version = "0.7.1-dev"
description = "Stellar cluster analysis package"
authors = [
    {name = "Gabriel I Perren", email = "gabrielperren@gmail.com"}
]
readme = "README.md"
license = "MIT"
keywords = ["cluster", "astrophysics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.12"
dependencies = [
    "astropy>=7.2.0",
    "fast-histogram>=0.14",
    "numpy>=2.4.0",
    "scipy>=1.17.0"
]

[project.optional-dependencies]
# Compiles the most demanding functions (faster synthetic clusters and likelihood)
numba = ["numba"]
# Required to load the UCC members file and by Cluster.to_csv()
pandas = ["pandas"]
all = ["numba", "pandas"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[project.urls]
homepage = "https://asteca.github.io/"
repository = "https://github.com/asteca/ASteCA"
documentation = "https://asteca.readthedocs.io/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
exclude = ["docs/"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/"]
